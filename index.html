<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dive into AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ====== Primitives ====== */
    :root {
      --bg-base: #0A0E17;
      --bg-elevated: #111827;
      --bg-card: #161B22;
      --bg-inset: #0D1117;

      --text-primary: #E5E7EB;
      --text-secondary: #9CA3AF;
      --text-tertiary: #6B7280;
      --text-muted: #4B5563;

      --accent: #6366F1;
      --accent-light: rgba(99, 102, 241, 0.15);
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-hover: #818CF8;

      --border-standard: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.35);
      --border-focus: rgba(99, 102, 241, 0.25);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;

      --shadow-rest: 0 0 0 1px rgba(255,255,255,0.04);
      --shadow-hover: 0 0 0 1px var(--border-hover), 0 8px 32px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 20px rgba(99,102,241,0.15);

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;
      --space-20: 80px;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;

      --transition-fast: 0.15s ease;
      --transition-base: 0.3s ease;
    }

    /* ====== Domain Colors ====== */
    .field-chip      { --field: #3B82F6; --field-glow: rgba(59,130,246,0.25); --field-bg: rgba(59,130,246,0.1); }
    .field-interconnect { --field: #10B981; --field-glow: rgba(16,185,129,0.25); --field-bg: rgba(16,185,129,0.1); }
    .field-llm       { --field: #8B5CF6; --field-glow: rgba(139,92,246,0.25); --field-bg: rgba(139,92,246,0.1); }
    .field-compress  { --field: #F59E0B; --field-glow: rgba(245,158,11,0.25); --field-bg: rgba(245,158,11,0.1); }
    .field-inference { --field: #EC4899; --field-glow: rgba(236,72,153,0.25); --field-bg: rgba(236,72,153,0.1); }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ====== Background Grid Effect ====== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ====== Navigation ====== */
    nav {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-6);
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .nav-brand .brand-icon {
      width: 28px;
      height: 28px;
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }

    .nav-links a:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.05);
    }

    /* ====== Hero ====== */
    .hero {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid var(--border-standard);
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 60%);
    }

    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-20) var(--space-6) var(--space-12);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--accent-light);
      color: var(--accent-hover);
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 50px;
      margin-bottom: var(--space-5);
      border: 1px solid rgba(99,102,241,0.2);
      letter-spacing: 0.3px;
    }

    .hero-badge .dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-glow);
      animation: pulse-glow 2.5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent-glow); }
      50% { opacity: 0.5; box-shadow: 0 0 2px var(--accent-glow); }
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: var(--space-4);
      letter-spacing: -0.02em;
    }

    .hero h1 .gradient-text {
      background: linear-gradient(135deg, var(--accent) 0%, #A855F7 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 520px;
      margin-bottom: var(--space-10);
      line-height: 1.7;
    }

    /* ====== Stats ====== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: var(--space-5);
      max-width: 560px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-lg);
      padding: var(--space-5) var(--space-6);
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), #A855F7);
      opacity: 0.6;
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }

    .stat-card .stat-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-weight: 600;
      margin-bottom: var(--space-2);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .stat-card .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .stat-card .stat-delta {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      margin-top: var(--space-2);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .stat-delta .trend-up {
      color: #34D399;
      font-weight: 700;
    }

    /* ====== Main Content ====== */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-12) var(--space-6) var(--space-16);
    }

    /* ====== Section Header ====== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
      gap: var(--space-4);
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .section-count {
      font-size: 0.85rem;
      color: var(--text-tertiary);
      font-weight: 400;
      margin-top: var(--space-1);
    }

    /* ====== Search ====== */
    .search-wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
    }

    .search-wrap input {
      width: 100%;
      padding: var(--space-3) var(--space-4) var(--space-3) 42px;
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .search-wrap input::placeholder {
      color: var(--text-muted);
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--border-focus), 0 0 20px rgba(99,102,241,0.1);
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ====== Domain Filters ====== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
      padding-bottom: var(--space-6);
      border-bottom: 1px solid var(--border-standard);
    }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--border-standard);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      padding: var(--space-2) var(--space-5);
      border-radius: 50px;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
      background: rgba(255,255,255,0.04);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--accent), #7C3AED);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 16px rgba(99,102,241,0.3);
    }

    .filter-btn .filter-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.5;
    }

    .filter-btn.active .filter-dot {
      opacity: 1;
      background: #fff;
    }

    /* ====== Papers Grid ====== */
    .papers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-5);
    }

    @media (min-width: 1024px) {
      .papers-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .papers-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .papers-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ====== Paper Card ====== */
    .paper-card {
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      transition: all var(--transition-base);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .paper-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--field, var(--accent));
      opacity: 0;
      transition: opacity var(--transition-base);
      box-shadow: 0 0 12px var(--field-glow, var(--accent-glow));
    }

    .paper-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover), 0 0 30px var(--field-glow, var(--accent-glow));
      transform: translateY(-4px);
    }

    .paper-card:hover::before {
      opacity: 1;
    }

    .paper-card.hidden {
      display: none;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .field-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--field-bg, var(--accent-light));
      color: var(--field, var(--accent));
      border: 1px solid var(--field, var(--accent));
      opacity: 0.85;
      letter-spacing: 0.3px;
    }

    .paper-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text-primary);
      margin-bottom: var(--space-3);
      letter-spacing: -0.01em;
    }

    .paper-summary {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.75;
      margin-bottom: var(--space-5);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-standard);
      margin-top: auto;
    }

    .paper-meta {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .paper-venue {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      font-family: var(--font-mono);
    }

    .paper-year {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ====== Star Rating ====== */
    .star-rating {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--space-1);
    }

    .stars {
      display: flex;
      gap: 2px;
    }

    .star {
      width: 14px;
      height: 14px;
      color: var(--field, var(--accent));
    }

    .star.empty {
      color: var(--text-muted);
      opacity: 0.3;
    }

    .score-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ====== Empty State ====== */
    .empty-state {
      text-align: center;
      padding: var(--space-16) var(--space-6);
      color: var(--text-tertiary);
      display: none;
    }

    .empty-state.show {
      display: block;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
      margin-bottom: var(--space-4);
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    /* ====== Footer ====== */
    footer {
      position: relative;
      z-index: 1;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-standard);
      padding: var(--space-10) var(--space-6);
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
    }

    .footer-left {
      font-size: 0.85rem;
      color: var(--text-tertiary);
    }

    .footer-left a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .footer-left a:hover {
      color: var(--accent-hover);
    }

    .footer-center {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-right {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .heart {
      color: #EC4899;
    }

    /* ====== Scroll Top ====== */
    .scroll-top {
      position: fixed;
      bottom: var(--space-6);
      right: var(--space-6);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(12px);
      transition: all var(--transition-base);
      box-shadow: var(--shadow-rest);
      z-index: 99;
    }

    .scroll-top.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .scroll-top:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* ====== Responsive ====== */
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .hero-inner { padding: var(--space-12) var(--space-5) var(--space-8); }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .section-header { flex-direction: column; align-items: flex-start; }
      .search-wrap { max-width: 100%; }
      .main { padding: var(--space-8) var(--space-5) var(--space-12); }
      .footer-inner { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="#" class="nav-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      Dive into AI
    </a>
    <div class="nav-links">
      <a href="#papers">文献库</a>
      <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-badge">
        <span class="dot"></span>
        AI Chip & Model Optimization
      </div>
      <h1><span class="gradient-text">Dive into AI</span></h1>
      <p class="hero-subtitle">聚焦 AI 芯片与模型优化前沿文献，从 Hopper 架构到推理引擎，追踪算力与算法的每一次突破。</p>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">文献总量</div>
          <div class="stat-number" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">近7天新增</div>
          <div class="stat-number" id="statRecent">0</div>
          <div class="stat-delta">
            <span class="trend-up">&#8593;</span>
            <span>持续收录中</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">技术领域</div>
          <div class="stat-number" id="statFields">0</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" id="papers">
    <div class="section-header">
      <div>
        <h2 class="section-title">文献库</h2>
        <div class="section-count" id="filterCount">共 0 篇文献</div>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索标题、摘要或关键词..." oninput="filterArticles()">
      </div>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <div class="papers-grid" id="papersGrid"></div>

    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <p>未找到匹配的文献，请尝试其他关键词或筛选条件</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        数据来源：AI 自动化分析与公开学术数据库 &middot;
        <a href="https://github.com" target="_blank" rel="noopener">查看 GitHub 仓库</a>
      </div>
      <div class="footer-center">
        Built with <span class="heart">&#10084;</span> for AI chip researchers
      </div>
      <div class="footer-right">
        最后更新：2026-05-11
      </div>
    </div>
  </footer>

  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <script>
    // ============================================================
    // 文献数据 —— 直接在此数组中添加或修改文献
    // ============================================================
    const articles = [

    // ============================================================
    // 领域配置
    // ============================================================
    const fieldConfig = {
      all:          { label: "全部", color: "#6366F1" },
      chip:         { label: "AI芯片", color: "#3B82F6" },
      interconnect: { label: "互联技术", color: "#10B981" },
      llm:          { label: "大模型优化", color: "#8B5CF6" },
      compress:     { label: "模型压缩", color: "#F59E0B" },
      inference:    { label: "推理引擎", color: "#EC4899" },
    };

    // ============================================================
    // 状态
    // ============================================================
    let activeField = "all";

    // ============================================================
    // 工具函数
    // ============================================================
    function getFieldClass(slug) {
      const map = {
        chip: "field-chip",
        interconnect: "field-interconnect",
        llm: "field-llm",
        compress: "field-compress",
        inference: "field-inference"
      };
      return map[slug] || "";
    }

    function getFieldColor(slug) {
      return fieldConfig[slug]?.color || fieldConfig.all.color;
    }

    function getFieldLabel(slug) {
      return fieldConfig[slug]?.label || slug;
    }

    function isWithinDays(dateStr, days) {
      const d = new Date(dateStr);
      const now = new Date("2026-05-11");
      const diff = (now - d) / (1000 * 60 * 60 * 24);
      return diff <= days;
    }

    function renderStars(score) {
      const fullStars = Math.floor(score / 0.2);
      const hasHalf = (score / 0.2) - fullStars >= 0.5;
      const emptyStars = 5 - fullStars - (hasHalf ? 1 : 0);
      let html = '';
      const starSvg = '<svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      const halfSvg = '<svg class="star" viewBox="0 0 24 24"><defs><linearGradient id="half"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs><path fill="url(#half)" stroke="currentColor" stroke-width="1" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      const emptySvg = '<svg class="star empty" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      for (let i = 0; i < fullStars; i++) html += starSvg;
      if (hasHalf) html += halfSvg;
      for (let i = 0; i < emptyStars; i++) html += emptySvg;
      return html;
    }

    // ============================================================
    // 渲染
    // ============================================================
    function renderFilters() {
      const bar = document.getElementById("filterBar");
      const fields = ["all", "chip", "interconnect", "llm", "compress", "inference"];
      bar.innerHTML = fields.map(slug => {
        const cfg = fieldConfig[slug];
        const count = slug === "all"
          ? articles.length
          : articles.filter(a => a.fieldSlug === slug).length;
        const isActive = activeField === slug;
        return `
          <button class="filter-btn ${isActive ? "active" : ""}" onclick="setField('${slug}')">
            <span class="filter-dot" style="background:${cfg.color}"></span>
            ${cfg.label} <span style="opacity:0.6">(${count})</span>
          </button>
        `;
      }).join("");
    }

    function renderArticles() {
      const grid = document.getElementById("papersGrid");
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtered = articles.filter(a => {
        const matchField = activeField === "all" || a.fieldSlug === activeField;
        const matchSearch = !search ||
          a.title.toLowerCase().includes(search) ||
          a.summary.toLowerCase().includes(search) ||
          a.field.toLowerCase().includes(search);
        return matchField && matchSearch;
      });

      document.getElementById("filterCount").textContent = `共 ${filtered.length} 篇文献`;

      grid.innerHTML = filtered.map(a => {
        const fieldCls = getFieldClass(a.fieldSlug);
        const fieldColor = getFieldColor(a.fieldSlug);
        return `
          <a href="${a.link}" target="_blank" rel="noopener" class="paper-card ${fieldCls}">
            <div class="card-header">
              <span class="field-badge">${getFieldLabel(a.fieldSlug)}</span>
            </div>
            <h3 class="paper-title">${a.title}</h3>
            <p class="paper-summary">${a.summary}</p>
            <div class="card-footer">
              <div class="paper-meta">
                <span class="paper-venue">${a.venue}</span>
                <span class="paper-year">${a.year}</span>
              </div>
              <div class="star-rating">
                <div class="stars">${renderStars(a.score)}</div>
                <span class="score-label">AI Score ${(a.score * 100).toFixed(0)}</span>
              </div>
            </div>
          </a>
        `;
      }).join("");

      document.getElementById("emptyState").classList.toggle("show", filtered.length === 0);
    }

    function renderStats() {
      document.getElementById("statTotal").textContent = articles.length;
      // 模拟最近7天新增数据（基于 year 为 2024 的文章数量作为演示）
      document.getElementById("statRecent").textContent = articles.filter(a => a.year === 2024).length;
      document.getElementById("statFields").textContent = Object.keys(fieldConfig).length - 1;
    }

    // ============================================================
    // 交互
    // ============================================================
    function setField(slug) {
      activeField = slug;
      renderFilters();
      renderArticles();
    }

    function filterArticles() {
      renderArticles();
    }

    // Scroll top button
    window.addEventListener("scroll", () => {
      document.getElementById("scrollTop").classList.toggle("visible", window.scrollY > 500);
    });

    // ============================================================
    // 初始化
    // ============================================================
    renderStats();
    renderFilters();
    renderArticles();
  </script>
