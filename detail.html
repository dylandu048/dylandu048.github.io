<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文献解读 - Dive into AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0A0E17;
      --bg-elevated: #111827;
      --bg-card: #161B22;
      --bg-inset: #0D1117;
      --text-primary: #E5E7EB;
      --text-secondary: #9CA3AF;
      --text-tertiary: #6B7280;
      --text-muted: #4B5563;
      --accent: #6366F1;
      --accent-light: rgba(99, 102, 241, 0.15);
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-hover: #818CF8;
      --border-standard: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.35);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --shadow-rest: 0 0 0 1px rgba(255,255,255,0.04);
      --shadow-hover: 0 0 0 1px var(--border-hover), 0 8px 32px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 20px rgba(99,102,241,0.15);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --transition-fast: 0.15s ease;
      --transition-base: 0.3s ease;
    }

    .field-chip      { --field: #3B82F6; --field-glow: rgba(59,130,246,0.25); --field-bg: rgba(59,130,246,0.1); }
    .field-interconnect { --field: #10B981; --field-glow: rgba(16,185,129,0.25); --field-bg: rgba(16,185,129,0.1); }
    .field-llm       { --field: #8B5CF6; --field-glow: rgba(139,92,246,0.25); --field-bg: rgba(139,92,246,0.1); }
    .field-compress  { --field: #F59E0B; --field-glow: rgba(245,158,11,0.25); --field-bg: rgba(245,158,11,0.1); }
    .field-inference { --field: #EC4899; --field-glow: rgba(236,72,153,0.25); --field-bg: rgba(236,72,153,0.1); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Navigation */
    nav {
      position: relative;
      z-index: 10;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-brand svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }

    .nav-back {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-standard);
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-back:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
      background: rgba(255,255,255,0.04);
    }

    /* Article Header */
    .article-hero {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px 32px;
      border-bottom: 1px solid var(--border-standard);
    }

    .article-meta-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .field-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--field-bg, var(--accent-light));
      color: var(--field, var(--accent));
      border: 1px solid var(--field, var(--accent));
      opacity: 0.85;
      letter-spacing: 0.3px;
    }

    .article-year {
      font-size: 0.85rem;
      color: var(--text-tertiary);
      font-family: var(--font-mono);
    }

    .article-hero h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-primary);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .article-venue {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .article-venue strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .article-score-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-lg);
    }

    .score-bar-track {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--field, var(--accent)), var(--accent-hover));
      transition: width 1s ease;
    }

    .score-bar-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--field, var(--accent));
      white-space: nowrap;
    }

    /* Article Content */
    .article-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .article-content h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 40px 0 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-standard);
      letter-spacing: -0.01em;
    }

    .article-content h2:first-child {
      margin-top: 0;
    }

    .article-content h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 28px 0 12px;
    }

    .article-content p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.85;
    }

    .article-content ul, .article-content ol {
      margin: 16px 0 16px 24px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .article-content li {
      margin-bottom: 8px;
      line-height: 1.7;
    }

    .article-content blockquote {
      margin: 24px 0;
      padding: 18px 24px;
      border-left: 3px solid var(--field, var(--accent));
      background: var(--bg-card);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.8;
      font-style: italic;
    }

    .article-content code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg-inset);
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--accent-hover);
      border: 1px solid var(--border-standard);
    }

    .article-content pre {
      background: var(--bg-inset);
      padding: 20px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 20px 0;
      border: 1px solid var(--border-standard);
    }

    .article-content pre code {
      background: none;
      padding: 0;
      border: none;
      color: var(--text-primary);
      font-size: 0.88rem;
    }

    .highlight-box {
      background: var(--field-bg, var(--accent-light));
      border: 1px solid var(--field, var(--accent));
      opacity: 0.85;
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin: 24px 0;
    }

    .highlight-box h4 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--field, var(--accent));
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .highlight-box p {
      margin-bottom: 0;
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    .article-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 32px 0;
    }

    .article-tag {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      background: var(--bg-inset);
      padding: 5px 14px;
      border-radius: 50px;
      border: 1px solid var(--border-standard);
    }

    .article-nav {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border-standard);
    }

    .article-nav a {
      flex: 1;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all var(--transition-base);
      max-width: 48%;
    }

    .article-nav a:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-glow);
      color: var(--text-primary);
    }

    .article-nav .nav-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .article-nav .nav-title {
      font-weight: 600;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-nav a.next {
      text-align: right;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-standard);
      padding: 32px 24px;
      text-align: center;
    }

    footer p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .heart {
      color: #EC4899;
    }

    /* Not Found */
    .not-found {
      text-align: center;
      padding: 120px 24px;
      color: var(--text-tertiary);
    }

    .not-found h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .not-found p {
      margin-bottom: 24px;
    }

    .not-found a {
      display: inline-block;
      padding: 10px 24px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }

    .not-found a:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    @media (max-width: 640px) {
      .article-hero { padding: 32px 20px 24px; }
      .article-content { padding: 28px 20px 48px; }
      .article-nav { flex-direction: column; }
      .article-nav a { max-width: 100%; }
      .article-nav a.next { text-align: left; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      Dive into AI
    </a>
    <a href="index.html" class="nav-back">&larr; 返回文献库</a>
  </nav>

  <div id="articleContainer">
    <!-- 内容由 JS 动态渲染 -->
  </div>

  <footer>
    <p>Built with <span class="heart">&#10084;</span> for AI chip researchers &middot; <a href="index.html">Dive into AI</a></p>
  </footer>

  <script src="data.js?v=2"></script>
  <script>
    // ============================================================
    // 工具函数
    // ============================================================
    function getFieldClass(slug) {
      const map = {
        chip: "field-chip",
        interconnect: "field-interconnect",
        llm: "field-llm",
        compress: "field-compress",
        inference: "field-inference"
      };
      return map[slug] || "";
    }

    function getFieldColor(slug) {
      const map = {
        chip: "#3B82F6",
        interconnect: "#10B981",
        llm: "#8B5CF6",
        compress: "#F59E0B",
        inference: "#EC4899"
      };
      return map[slug] || "#6366F1";
    }

    function renderStars(score) {
      const fullStars = Math.floor(score / 0.2);
      const hasHalf = (score / 0.2) - fullStars >= 0.5;
      const emptyStars = 5 - fullStars - (hasHalf ? 1 : 0);
      let html = '';
      const starSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      const halfSvg = '<svg width="14" height="14" viewBox="0 0 24 24"><defs><linearGradient id="half"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs><path fill="url(#half)" stroke="currentColor" stroke-width="1" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      const emptySvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" opacity="0.2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      for (let i = 0; i < fullStars; i++) html += starSvg;
      if (hasHalf) html += halfSvg;
      for (let i = 0; i < emptyStars; i++) html += emptySvg;
      return html;
    }

    // ============================================================
    // 主逻辑
    // ============================================================
    function init() {
      const container = document.getElementById("articleContainer");

      if (typeof articles === 'undefined' || typeof articleDetails === 'undefined') {
        container.innerHTML = `
          <div class="not-found">
            <h2>数据加载失败</h2>
            <p>文献数据未能正确加载，通常是 <code>data.js</code> 中存在语法错误。</p>
            <p style="margin-top:12px;font-size:0.85rem;color:var(--text-muted);">
              提示：如果刚刚添加过新文章，请检查 <code>articleDetails</code> 对象中是否在旧条目末尾漏写了逗号。
            </p>
            <a href="index.html">返回文献库</a>
          </div>
        `;
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id"), 10);

      const article = articles.find(a => a.id === id);
      const detail = articleDetails[id];

      const container = document.getElementById("articleContainer");

      if (!article || !detail) {
        container.innerHTML = `
          <div class="not-found">
            <h2>文献未找到</h2>
            <p>请检查链接是否正确，或返回文献库浏览其他内容。</p>
            <a href="index.html">返回文献库</a>
          </div>
        `;
        return;
      }

      const fieldCls = getFieldClass(article.fieldSlug);
      const fieldColor = getFieldColor(article.fieldSlug);

      // 相邻文章
      const prevArticle = articles.find(a => a.id === id - 1);
      const nextArticle = articles.find(a => a.id === id + 1);

      let navHtml = '<div class="article-nav">';
      if (prevArticle) {
        navHtml += `<a href="detail.html?id=${prevArticle.id}"><div class="nav-label">上一篇</div><div class="nav-title">${prevArticle.title}</div></a>`;
      } else {
        navHtml += '<a href="index.html"><div class="nav-label">返回</div><div class="nav-title">文献库首页</div></a>';
      }
      if (nextArticle) {
        navHtml += `<a href="detail.html?id=${nextArticle.id}" class="next"><div class="nav-label">下一篇</div><div class="nav-title">${nextArticle.title}</div></a>`;
      } else {
        navHtml += '<a href="index.html" class="next"><div class="nav-label">返回</div><div class="nav-title">文献库首页</div></a>';
      }
      navHtml += '</div>';

      container.innerHTML = `
        <article class="${fieldCls}">
          <header class="article-hero">
            <div class="article-meta-top">
              <span class="field-badge">${article.field}</span>
              <span class="article-year">${article.year}</span>
            </div>
            <h1>${article.title}</h1>
            <div class="article-venue">
              <strong>来源：</strong>${article.venue}
            </div>
            <div class="article-score-bar">
              <div class="score-bar-track">
                <div class="score-bar-fill" style="width:0%"></div>
              </div>
              <div class="score-bar-label">AI Score ${(article.score * 100).toFixed(0)}</div>
            </div>
          </header>

          <div class="article-content">
            <h2>论文概述</h2>
            <p>${detail.overview}</p>

            <div class="highlight-box">
              <h4>核心洞察</h4>
              <p>${detail.coreIdea}</p>
            </div>

            <h2>技术细节</h2>
            <p>${detail.technical}</p>

            <h2>实验与结果</h2>
            <p>${detail.experiments}</p>

            <h2>影响与意义</h2>
            <p>${detail.impact}</p>

            <h2>个人思考</h2>
            <p>${detail.thoughts}</p>

            <div class="article-tags">
              <span class="article-tag">${article.field}</span>
              <span class="article-tag">${article.venue}</span>
              <span class="article-tag">${article.year}</span>
              <span class="article-tag">AI Score ${(article.score * 100).toFixed(0)}</span>
            </div>

            ${navHtml}
          </div>
        </article>
      `;

      // 动画填充进度条
      requestAnimationFrame(() => {
        const fill = document.querySelector('.score-bar-fill');
        if (fill) {
          setTimeout(() => {
            fill.style.width = (article.score * 100) + '%';
          }, 200);
        }
      });

      document.title = `${article.title} - Dive into AI`;
    }

    init();
  </script>
</body>
</html>
